<!DOCTYPE html>
<html>
<head><title>Update Student</title></head>
<body>
<h1>Update student details</h1>
<form method="POST">
{% csrf_token %}
<label>Name:</label>
<input type="text" name="name" value="{{ student.name }}" required><br><br>

<label>Email:</label>
<input type="email" name="email" value="{{ student.email }}" required><br><br>

<label>Course:</label>
<input type="text" name="course" value="{{ student.course }}" required><br><br>

<label>Age:</label>
<input type="number" name="age" value="{{ student.age }}" required><br><br>

<label>Phone:</label>
<input type="text" name="phone" value="{{ student.phone }}" required><br><br>

<button type="submit">Update Student</button>
</form>
<br>
<a href="{% url 'student_list' %}">Back to Student List</a>
</body>
</html>
