<!DOCTYPE html>
<html>
<body>
<h1>Student Details</h1>
<table border="1" cellpadding="10">
<tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Age</th><th>Phone</th></tr>
{% for student in students %}
<tr>
<td>{{ student.id }}</td>
<td>{{ student.name }}</td>
<td>{{ student.email }}</td>
<td>{{ student.course }}</td>
<td>{{ student.age }}</td>
<td>{{ student.phone }}</td>
</tr>
{% endfor %}
</table>
<br><a href="/student_list/">Back to List</a>
</body>
</html>
