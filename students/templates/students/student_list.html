<!DOCTYPE html>
<html>
<body>
<h1>Student List</h1>
<table border="1" cellpadding="10">
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>
<th>Age</th>
<th>Phone</th>
<th>Update</th>
<th>Delete</th>
</tr>
{% for student in students %}
<tr>
<td>{{ student.id }}</td>
<td>{{ student.name }}</td>
<td>{{ student.email }}</td>
<td>{{ student.course }}</td>
<td>{{ student.age }}</td>
<td>{{ student.phone }}</td>
<td><a href="{% url 'update_student' student.id %}">Update</a></td>
<td><a href="{% url 'delete_student' student.id %}">Delete</a></td>
</tr>
{% endfor %}
</table>
<br>
<a href="{% url 'student_details' %}">View Student Details</a>
</body>
</html>
